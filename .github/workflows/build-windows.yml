name: build-windows
on:
  workflow_dispatch:
  push:
    branches: [claude/graphify-uqxds4, main]
permissions:
  contents: write
jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run dist:win
      - name: Publish Hologram.exe to the "hologram-latest" release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la release/Hologram.exe
          gh release delete hologram-latest --cleanup-tag --yes || true
          gh release create hologram-latest release/Hologram.exe \
            --prerelease \
            --title "Hologram (latest build)" \
            --notes "Unsigned portable build of commit ${GITHUB_SHA}. Windows SmartScreen will warn: More info -> Run anyway." \
            --target "${GITHUB_SHA}"
