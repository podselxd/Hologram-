name: build-windows
on:
  workflow_dispatch:
  push:
    branches: [claude/graphify-uqxds4, main]
    tags: ['v*']
permissions:
  contents: write
jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag must match package.json version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}"; exit 1
          fi
      - run: npm run check
      - run: npm run dist:win
      - name: The packaged app can load the mouse-control library (koffi + user32)
        shell: bash
        run: |
          test -f release/win-unpacked/resources/app/node_modules/@koromix/koffi-win32-x64/package.json
          ELECTRON_RUN_AS_NODE=1 ./release/win-unpacked/Hologram.exe -e "const k=require('./release/win-unpacked/resources/app/node_modules/koffi'); const u=k.load('user32.dll'); u.func('bool __stdcall SetCursorPos(int x, int y)'); console.log('koffi ok')"
      - name: Checksum
        shell: bash
        run: |
          cd release
          sha256sum Hologram.exe > Hologram.exe.sha256
          cat Hologram.exe.sha256
          ls -la Hologram.exe
      - name: Publish development build (hologram-latest, prerelease)
        if: github.ref_type == 'branch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete hologram-latest --cleanup-tag --yes || true
          gh release create hologram-latest release/Hologram.exe release/Hologram.exe.sha256 \
            --prerelease \
            --title "Hologram (latest build)" \
            --notes "Unsigned development build of commit ${GITHUB_SHA}. Not used by the auto-updater. Windows SmartScreen will warn: More info -> Run anyway." \
            --target "${GITHUB_SHA}"
      - name: Publish this version automatically when it has no release yet
        if: github.ref_type == 'branch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tests and the build already passed. Never overwrite: skip if the release or the tag exists.
          ver="v$(node -p "require('./package.json').version")"
          if gh release view "$ver" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$ver" >/dev/null 2>&1; then
            echo "$ver is already published; nothing to do"
          else
            gh release create "$ver" release/Hologram.exe release/Hologram.exe.sha256 \
              --title "Hologram $ver" \
              --notes "Unsigned portable build of commit ${GITHUB_SHA}, published automatically because package.json moved to ${ver}. Windows SmartScreen will warn: More info -> Run anyway. Installed copies pick this up on their own." \
              --target "${GITHUB_SHA}"
          fi
      - name: Publish versioned release (used by the auto-updater)
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release may already exist (created from the web UI when the tag was made): then just attach the files.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release/Hologram.exe release/Hologram.exe.sha256 --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release/Hologram.exe release/Hologram.exe.sha256 \
              --title "Hologram ${GITHUB_REF_NAME}" \
              --notes "Unsigned portable build. Windows SmartScreen will warn: More info -> Run anyway. Installed copies offer this update from the tray icon."
          fi
