name: build-windows
on:
  workflow_dispatch:
  push:
    branches: [claude/graphify-uqxds4, main]
jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run dist:win
      - name: List artifacts
        run: Get-ChildItem release -Filter *.exe | Select-Object Name, Length
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: Hologram-windows
          path: |
            release/Hologram-*.exe
          if-no-files-found: error
          retention-days: 30
